<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concerts Graz</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- 1. CSS-Datei einbinden -->
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

<!-- Header (scrollt mit) -->
<header class="main-header">
    <div class="header-container">
        <div class="logo">
            <a href="#">Concerts Graz</a>
        </div>
        <nav class="header-nav">
            <a href="#concerts" class="nav-link" id="nav-concerts">Konzerte</a>
            <a href="#calendar" class="nav-link" id="nav-calendar">Kalender</a>

            <!-- Zustand 1: Nicht angemeldet -->
            <button id="btn-open-login" class="btn-login" type="button">Login</button>

            <!-- Zustand 2: Angemeldet (wird per JS eingeblendet) -->
            <div id="user-menu" class="user-menu hidden">
                <button id="btn-open-profile" class="btn-profile" type="button">👤 Mein Profil</button>
                <button id="btn-logout" class="btn-logout" type="button">Logout</button>
            </div>
        </nav>
    </div>
</header>

<!-- Filterleiste (Fixiert / Sticky beim Scrollen) -->
<section class="filter-bar">
    <div class="filter-container">
        <div class="filter-group">
            <label for="filter-venue">Location</label>
            <select id="filter-venue">
                <option value="all">Alle Locations ▾</option>
                <option value="ppc">PPC Graz</option>
                <option value="wakuum">club wakuum Graz</option>
                <option value="cafewolf">Café Wolf</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-genre">Genre</label>
            <select id="filter-genre">
                <option value="all">Alle Genres ▾</option>
                <option value="metal">Metal</option>
                <option value="rock">Rock</option>
                <option value="electronic">Elektronisch</option>
                <option value="hiphop">Hip-Hop & Rap</option>
                <option value="pop">Pop</option>
                <option value="other">Sonstiges</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-date">Datum</label>
            <select id="filter-date">
                <option value="all">Alle Termine ▾</option>
                <option value="today">Heute</option>
                <option value="weekend">Dieses Wochenende</option>
                <option value="month">Diesen Monat</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-price">Preis</label>
            <select id="filter-price">
                <option value="all">Alle Preise ▾</option>
                <option value="free">Gratis / Pay As You Wish</option>
                <option value="under15">Unter 15 €</option>
            </select>
        </div>
    </div>
</section>

<!-- Hauptbereich: Konzert-Grid -->
<main class="content-wrapper">
    <div id="concert-grid" class="concert-grid">

        <!-- Beispiel-Karte (wird später per app.js dynamisch aus der API geladen) -->
        <article class="concert-card">
            <div class="card-badge">12. SEP</div>
            <div class="card-content">
                <span class="card-genre">Rock, Punk & Indie</span>
                <h3 class="card-title">The Burning Flags - Fast Love</h3>
                <p class="card-location">📍 club wakuum Graz</p>
                <p class="card-price">🎟️ Pay As You Wish</p>
            </div>
            <div class="card-footer">
                <button class="btn-bookmark" type="button">♡ Merken</button>
            </div>
        </article>

    </div>
</main>



<!-- Authentifizierung: Login/ Registrieren Overlay -->
<div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
        <button id="btn-close-modal" class="modal-close" type="button" aria-label="Schließen">&times;</button>

        <!-- Platzhalter für Fehler- und Erfolgsmeldungen -->
        <div id="auth-message" class="auth-message hidden"></div>

        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab active" type="button">Login</button>
            <button id="tab-register" class="auth-tab" type="button">Registrieren</button>
        </div>

        <!-- Login-Formular -->
        <form id="form-login" class="auth-form">
            <div class="form-group">
                <label for="login-user">E-Mail oder Benutzername</label>
                <input type="text" id="login-user" required placeholder="deine@email.at">
            </div>
            <div class="form-group">
                <label for="login-pass">Passwort</label>
                <input type="password" id="login-pass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>

        <!-- Registrierungs-Formular -->
        <form id="form-register" class="auth-form hidden">
            <div class="form-group">
                <label for="reg-user">Benutzername</label>
                <input type="text" id="reg-user" required placeholder="KonzertFan99">
            </div>
            <div class="form-group">
                <label for="reg-email">E-Mail</label>
                <input type="email" id="reg-email" required placeholder="deine@email.at">
            </div>
            <div class="form-group">
                <label for="reg-pass">Passwort</label>
                <input type="password" id="reg-pass" required placeholder="••••••••">
            </div>
            <!-- Passwort wiederholen -->
            <div class="form-group">
                <label for="reg-pass-confirm">Passwort bestätigen</label>
                <input type="password" id="reg-pass-confirm" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Konto erstellen</button>
        </form>
    </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
